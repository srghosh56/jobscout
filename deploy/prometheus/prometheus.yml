global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: jobscout-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8088"]
  # Dagster code server (Compose profile "orchestration"); shows as down when the profile is off.
  - job_name: jobscout-dagster
    metrics_path: /metrics
    static_configs:
      - targets: ["dagster-code:9465"]
