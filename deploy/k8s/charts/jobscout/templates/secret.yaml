{{- if not .Values.secrets.existingSecret }}
{{- $pg := .Values.postgres }}
{{- $host := include "jobscout.pgHost" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jobscout.secretName" . }}
  labels:
    {{- include "jobscout.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ default (printf "postgresql+asyncpg://%s:%s@%s:5432/%s" $pg.user $pg.password $host $pg.database) .Values.secrets.databaseUrl | quote }}
  READONLY_DATABASE_URL: {{ default (printf "postgresql+asyncpg://jobscout_ro:%s@%s:5432/%s" $pg.roPassword $host $pg.database) .Values.secrets.readonlyDatabaseUrl | quote }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
{{- end }}
