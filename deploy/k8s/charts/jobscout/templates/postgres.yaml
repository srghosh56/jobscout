{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jobscout.pgHost" . }}
  labels:
    {{- include "jobscout.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "jobscout.pgHost" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ $pg.image }}
          env:
            - {name: POSTGRES_USER, value: {{ $pg.user | quote }}}
            - {name: POSTGRES_PASSWORD, value: {{ $pg.password | quote }}}
            - {name: POSTGRES_DB, value: {{ $pg.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ $pg.user | quote }}]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $pg.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jobscout.pgHost" . }}
  labels:
    {{- include "jobscout.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
{{- end }}
